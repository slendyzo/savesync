<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0d14"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="0%" r="60%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="40%" r="40%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9c9caa"/>
    </linearGradient>
    <linearGradient id="cardSurface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b6dfb"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="winShadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect width="1200" height="720" fill="url(#glow1)"/>
  <rect width="1200" height="720" fill="url(#glow2)"/>

  <!-- window frame -->
  <g filter="url(#winShadow)">
    <rect x="60" y="50" width="1080" height="620" rx="14" fill="#0e0e16" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- title bar (no platform-specific chrome — Tauri uses native
         decorations on each OS, which differ) -->
    <rect x="60" y="50" width="1080" height="38" rx="14" fill="rgba(255,255,255,0.02)"/>
    <rect x="60" y="76" width="1080" height="12" fill="rgba(255,255,255,0.02)"/>
    <text x="600" y="73" text-anchor="middle" font-size="12" fill="#6b6b78" font-weight="500">SaveSync</text>

    <!-- separator under title -->
    <line x1="60" y1="88" x2="1140" y2="88" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- content padding starts at y=88 -->

    <!-- "connected" badge -->
    <g transform="translate(110, 130)">
      <rect width="200" height="26" rx="13" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="14" cy="13" r="3" fill="#34d399"/>
      <circle cx="14" cy="13" r="5" fill="#34d399" opacity="0.35"/>
      <text x="26" y="17" font-size="10" fill="#b8b8c4" font-family="'JetBrains Mono', monospace" letter-spacing="0.05em">connected · Desktop-PC</text>
    </g>

    <!-- big title -->
    <text x="110" y="240" font-size="72" font-weight="700" letter-spacing="-3" fill="url(#title)">SaveSync</text>

    <!-- subtitle -->
    <text x="110" y="280" font-size="18" font-weight="300" fill="#b8b8c4">Tracking 3 games · 2 machines.</text>

    <!-- header right side buttons (settings + add) -->
    <g transform="translate(1010, 130)">
      <rect width="34" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <g transform="translate(11, 11)" fill="none" stroke="#b8b8c4" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="2"/>
        <path d="M6 0v2M6 10v2M0 6h2M10 6h2M2 2l1.5 1.5M8.5 8.5L10 10M2 10l1.5-1.5M8.5 3.5L10 2"/>
      </g>
    </g>
    <g transform="translate(1054, 130)">
      <rect width="74" height="34" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <g transform="translate(12, 11)" fill="none" stroke="#b8b8c4" stroke-width="1.4" stroke-linecap="round">
        <path d="M6 0v12M0 6h12"/>
      </g>
      <text x="34" y="22" font-size="12" fill="#b8b8c4" font-weight="500">Add</text>
    </g>

    <!-- three stat cards -->
    <g transform="translate(110, 320)" filter="url(#cardShadow)">
      <!-- card 1: tracked games -->
      <g>
        <rect width="306" height="118" rx="14" fill="url(#cardSurface)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <!-- icon -->
        <g transform="translate(20, 20)" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="0" y="3" width="18" height="12" rx="3"/>
          <path d="M5 9h2M11 8v2M13 8h.01M15 10h.01"/>
        </g>
        <text x="20" y="64" font-size="10" letter-spacing="0.12em" fill="#6b6b78" font-weight="500">TRACKED GAMES</text>
        <text x="20" y="96" font-size="32" font-weight="600" fill="#f5f5f7">3</text>
        <text x="58" y="96" font-size="12" fill="#6b6b78">synced via this repo</text>
      </g>

      <!-- card 2: repo -->
      <g transform="translate(330, 0)">
        <rect width="306" height="118" rx="14" fill="url(#cardSurface)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <g transform="translate(20, 20)" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="3" cy="3" r="2"/>
          <circle cx="3" cy="15" r="2"/>
          <circle cx="15" cy="9" r="2"/>
          <path d="M3 5v8M5 9h8"/>
        </g>
        <text x="20" y="64" font-size="10" letter-spacing="0.12em" fill="#6b6b78" font-weight="500">REPO</text>
        <text x="20" y="89" font-size="14" font-family="'JetBrains Mono', monospace" fill="#f5f5f7">slendyzo/savesync-data</text>
        <text x="20" y="106" font-size="11" fill="#6b6b78">cloned to ~/.config/savesync</text>
      </g>

      <!-- card 3: status -->
      <g transform="translate(660, 0)">
        <rect width="306" height="118" rx="14" fill="url(#cardSurface)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <g transform="translate(20, 20)" fill="none" stroke="#34d399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 0l3 6 6 1-4 4 1 6L9 14l-6 3 1-6-4-4 6-1z"/>
        </g>
        <text x="20" y="64" font-size="10" letter-spacing="0.12em" fill="#6b6b78" font-weight="500">STATUS</text>
        <text x="20" y="96" font-size="32" font-weight="600" fill="#f5f5f7">Idle</text>
        <text x="100" y="96" font-size="12" fill="#6b6b78">watching for launches</text>
      </g>
    </g>

    <!-- games section label -->
    <text x="110" y="495" font-size="10" letter-spacing="0.12em" fill="#6b6b78" font-weight="500">GAMES</text>

    <!-- game card: Elden Ring -->
    <g transform="translate(110, 510)" filter="url(#cardShadow)">
      <rect width="966" height="64" rx="14" fill="url(#cardSurface)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="22" y="28" font-size="15" font-weight="500" fill="#f5f5f7">Elden Ring</text>
      <text x="22" y="48" font-size="11" font-family="'JetBrains Mono', monospace" fill="#6b6b78">C:\Users\you\AppData\Roaming\EldenRing\</text>
      <!-- last sync -->
      <text x="820" y="28" font-size="11" fill="#b8b8c4">2 min ago</text>
      <text x="820" y="44" font-size="9" fill="#6b6b78">via Desktop-PC</text>
      <!-- synced pill -->
      <g transform="translate(894, 18)">
        <rect width="56" height="20" rx="10" fill="rgba(52,211,153,0.15)" stroke="rgba(52,211,153,0)" stroke-width="0"/>
        <circle cx="12" cy="10" r="2.5" fill="#34d399"/>
        <text x="22" y="14" font-size="10" fill="#34d399" font-family="'JetBrains Mono', monospace" font-weight="500">synced</text>
      </g>
    </g>

    <!-- game card: BG3 -->
    <g transform="translate(110, 586)" filter="url(#cardShadow)">
      <rect width="966" height="64" rx="14" fill="url(#cardSurface)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="22" y="28" font-size="15" font-weight="500" fill="#f5f5f7">Baldur's Gate 3</text>
      <text x="22" y="48" font-size="11" font-family="'JetBrains Mono', monospace" fill="#6b6b78">~/.local/share/Larian Studios/Baldur's Gate 3/</text>
      <text x="820" y="28" font-size="11" fill="#b8b8c4">17 min ago</text>
      <text x="820" y="44" font-size="9" fill="#6b6b78">via ROG-Ally</text>
      <g transform="translate(894, 18)">
        <rect width="56" height="20" rx="10" fill="rgba(52,211,153,0.15)"/>
        <circle cx="12" cy="10" r="2.5" fill="#34d399"/>
        <text x="22" y="14" font-size="10" fill="#34d399" font-family="'JetBrains Mono', monospace" font-weight="500">synced</text>
      </g>
    </g>
  </g>
</svg>
