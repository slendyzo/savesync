name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Build (${{ matrix.platform }})
    needs: typecheck
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            tauri-args: ""
          - platform: windows-latest
            target: windows
            tauri-args: ""
          - platform: macos-14
            target: macos
            tauri-args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            git-lfs

      - name: Verify git-lfs (Windows)
        if: matrix.target == 'windows'
        run: git-lfs version

      - name: Install JS dependencies
        run: npm ci

      # Must run BEFORE cargo test: Tauri's build script validates that
      # every externalBin sidecar path exists, even during `cargo test`.
      # Without the sidecar in place, the test build fails with
      # "resource path 'bin\git-lfs-...' doesn't exist".
      - name: Fetch git-lfs sidecar for ${{ matrix.target }}
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            linux)   TRIPLE="x86_64-unknown-linux-gnu" ;;
            windows) TRIPLE="x86_64-pc-windows-msvc" ;;
            macos)   TRIPLE="universal-apple-darwin" ;;
          esac
          ./scripts/fetch-git-lfs.sh "$TRIPLE"

      - name: Run cargo tests
        working-directory: ./src-tauri
        run: cargo test --locked

      # On tag pushes: tauri-action handles release creation + uploads
      # the binaries AND the signed `latest.json` updater manifest to
      # the same release across the matrix. Required secrets:
      # - TAURI_SIGNING_PRIVATE_KEY: contents of ~/.tauri/savesync-updater.key
      # - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: empty in our setup
      # NOTE: don't pass TAURI_SIGNING_PRIVATE_KEY_PASSWORD as an env
      # var. Even when the secret doesn't exist, GitHub Actions
      # interpolates `${{ secrets.X }}` as an empty string, which
      # tauri's signer then tries to use as a decryption password
      # and fails with "Wrong password for that key" because the key
      # was generated unencrypted. Omitting the env line lets the
      # signer see no password env var at all, which is what it
      # expects for unencrypted keys.
      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: "SaveSync ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.tauri-args }}

      # SignPath Windows signing — runs only when SIGNPATH_API_TOKEN
      # is set as a repo secret. Until you've applied to SignPath's OSS
      # program and uploaded the secrets, this step is a no-op and the
      # released NSIS .exe will show a SmartScreen "unknown publisher"
      # warning. Apply at signpath.org/apply, then add the four
      # SIGNPATH_* repo secrets and the next tag will be signed.
      - name: SignPath sign (Windows)
        if: matrix.target == 'windows' && startsWith(github.ref, 'refs/tags/v') && env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.tauri.outputs.artifactPaths }}
          wait-for-completion: true
          output-artifact-directory: ./signed

      # Non-tag builds: keep the artifact upload for CI testing.
      - name: Upload artifacts (Linux)
        if: matrix.target == 'linux' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: savesync-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts (Windows)
        if: matrix.target == 'windows' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: savesync-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifacts (macOS)
        if: matrix.target == 'macos' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: savesync-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn
          retention-days: 14
