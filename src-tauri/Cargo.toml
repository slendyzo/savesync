[package]
name = "savesync"
version = "0.2.0"
description = "Steam Cloud-style save sync for any game, backed by a private git repo."
authors = ["SaveSync contributors"]
edition = "2021"
default-run = "savesync"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "savesync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Headless CLI for scripting / dev. Gated behind the `cli` feature so
# the GUI bundle build doesn't pick it up — Tauri's universal-darwin
# pipeline only lipo-merges the main binary, so any auto-discovered
# secondary bin fails the bundle step with "Failed to copy binary".
# Build it locally with `cargo build --features cli --bin savesync-cli`.
[[bin]]
name = "savesync-cli"
path = "src/bin/savesync-cli/main.rs"
required-features = ["cli"]

[features]
cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-openssl"] }
tracing = "0.1"
blake3 = "1"
walkdir = "2"
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
hostname = "0.4"
sysinfo = "0.32"
notify = "7"
notify-debouncer-full = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
steamlocate = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
httpmock = "0.7"
